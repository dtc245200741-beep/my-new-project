<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập Sử dụng Box Model 1</title>
    <!-- Liên kết tới tệp style.css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>So Sánh Content-Box và Border-Box Trong CSS</h1>

    <!-- Thẻ 1: content-box (màu xanh lá) -->
    <div class="card">
      Thẻ 1 (content-box): Kích thước tổng = 280 + 40 (padding) + 10 (border) =
      330px chiều rộng.
    </div>

    <!-- Thẻ 2: border-box (màu vàng) -->
    <div class="card">
      Thẻ 2 (border-box): Kích thước tổng giữ nguyên đúng 280px chiều rộng.
    </div>

    <!-- Thẻ 3: border-box (màu đỏ) -->
    <div class="card">
      Thẻ 3 (border-box): Kích thước tổng giữ nguyên đúng 280px chiều rộng.
    </div>
  </body>
</html>
