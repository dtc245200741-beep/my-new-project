<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành Tạo Menu Ngang Dropdown</title>
    <style>
      /* 1. Thiết lập chung phông chữ và reset margin/padding */
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      /* 2. Thiết lập khung phân vùng cho menu */
      #menu {
        height: 40px;
        background-color: #333333;
        border-radius: 4px;
      }

      #menu ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* 3. Định dạng thẻ li cho menu cấp 1 xếp nằm ngang */
      #menu > ul > li {
        float: left; /* Xếp các mục menu chính thành hàng ngang */
        position: relative; /* Tạo gốc tọa độ cho menu con thả xuống */
      }

      /* 4. Định dạng thẻ liên kết a trong menu */
      #menu a {
        display: block;
        width: 130px;
        height: 40px;
        line-height: 40px;
        text-align: center;
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
      }

      /* 5. Đổi màu nền sang màu đỏ khi rê chuột qua mục liên kết */
      #menu a:hover {
        background-color: #e74c3c;
      }

      /* 6. Định dạng danh sách menu con (cấp 2) - Định vị và Ẩn mặc định */
      #menu ul ul {
        position: absolute;
        top: 40px; /* Xuất hiện ngay phía dưới thanh menu chính */
        left: 0;
        background-color: #444444;
        visibility: hidden; /* Ẩn menu con mặc định */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      /* Đảm bảo các mục trong menu con xếp dọc */
      #menu ul ul li {
        float: none;
      }

      /* 7. Hiển thị menu con khi di chuột vào mục menu cha */
      #menu li:hover > ul {
        visibility: visible; /* Hiện menu con khi hover */
      }
    </style>
  </head>
  <body>
    <h2>Menu Ngang Dropdown</h2>

    <!-- Cấu trúc Menu ngang lồng nhau -->
    <div id="menu">
      <ul>
        <li>
          <a href="#">Trang chủ</a>
        </li>
        <li>
          <a href="#">Sản phẩm</a>
          <!-- Menu con thả xuống -->
          <ul>
            <li><a href="#">Điện thoại</a></li>
            <li><a href="#">Máy tính</a></li>
            <li><a href="#">Phụ kiện</a></li>
          </ul>
        </li>
        <li>
          <a href="#">Dịch vụ</a>
          <!-- Menu con thả xuống -->
          <ul>
            <li><a href="#">Bảo hành</a></li>
            <li><a href="#">Sửa chữa</a></li>
          </ul>
        </li>
        <li>
          <a href="#">Liên hệ</a>
        </li>
      </ul>
    </div>
  </body>
</html>
